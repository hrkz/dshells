[project]
name = "dshells"
version = "0.1.0"
description = "differentiable simulation code for rotating incompressible flows and magnetic fields in spherical shells"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flax>=0.12.7",
    "h5py>=3.16.0",
    "jax[cuda12]>=0.10.2",
    "jaxbind>=1.3.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "optax>=0.2.8",
    "pyevtk>=1.7.0",
    "ruff>=0.15.22",
    "shtns>=3.7.5",
    "tqdm>=4.68.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models"]
